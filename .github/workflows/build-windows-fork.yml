name: Windows-Installer (Fork, manuell)

# Baut NUR den Windows-Installer (.exe) – ohne Release, ohne Signatur-Schlüssel.
# Gedacht für eigene Forks: Actions → „Windows-Installer (Fork, manuell)“ → „Run workflow“.
# Das Ergebnis liegt danach auf der Seite des Laufs unter „Artifacts“ zum Download.
#
# Wichtig: Der eingebaute Updater zeigt im Fork-Build auf den eigenen Fork (statt auf das
# offizielle Repository). Sonst würde die App dein angepasstes Programm beim nächsten
# Update-Check durch die offizielle Version ersetzen.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer der App (x.y.z)'
        required: true
        default: '0.7.10'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Python-Abhängigkeiten installieren
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Tests der PDF-Vorlagen
        working-directory: src/backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/test_pdf_vorlage2.py -q

      - name: Backend-Sidecar bauen
        shell: pwsh
        run: pwsh scripts/build-sidecar.ps1

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren
        working-directory: src/frontend
        run: npm ci

      - name: Rust-Toolchain einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Version setzen und Updater auf den Fork umleiten
        shell: python
        run: |
          import json
          f = 'src-tauri/tauri.conf.json'
          d = json.load(open(f, encoding='utf-8'))
          d['version'] = '${{ inputs.version }}'
          d['plugins']['updater']['endpoints'] = [
              'https://github.com/${{ github.repository }}/releases/latest/download/latest.json'
          ]
          json.dump(d, open(f, 'w', encoding='utf-8'), indent=2)

      - name: Tauri CLI installieren
        run: npm install -g @tauri-apps/cli@^2

      - name: Windows-Installer bauen
        run: tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Installer als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RechnungsFee-Windows-Installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
